<text x="689.36" y="50">legend / intent:</text>
<text x="689.36" y="64">8 phy_adp lanes, 51.84 x 207.36, pins on W face</text>
<text x="689.36" y="78">(409/adp: c_d 128 -> cdc_pc, r_d 128 &lt;- phy_pad,</text>
<text x="689.36" y="92">rx_flit 147) + tx_flit 147 on N face</text>
<text x="689.36" y="106">blue: W-face escape into the gap, then up / west</text>
<text x="689.36" y="120">orange dashed: tx/rx flits to the serdes windows (N)</text>
<text x="689.36" y="134">rule: one lane per adp, lanes side by side;</text>
<text x="689.36" y="148">gap sized from bits: 409 b / (44.6 V tracks/um x 0.8)</text>
<text x="689.36" y="162">= 11.5 um minimum; 8.64 um before (ratio 1.06),</text>
<text x="689.36" y="176">25.92 um now (6 gaps) + 17.28 um (adp3|adp7): 0.35-0.53</text>
<text x="689.36" y="190">cdc_ci slides +103.68 um to make room (8.64 lattice)</text>
<text x="689.36" y="204">phy_pad stays W of the comb (r_d/in_* partner),</text>
<text x="689.36" y="218">cdc_pc stays NW (c_d partner); serdes on N face</text>
<text x="689.36" y="232">no search: hand layout, legal.py 0, lattice-legal</text>
