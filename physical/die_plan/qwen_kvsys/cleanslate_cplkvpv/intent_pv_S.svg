<text x="56.8" y="61.2" fill="#1d8a3a">pd regs -> pv2 (256 b/slice) broadcast to 8 pairs (rows p0+p2 / p1+p3), pe2 32 b to 2, bc 19-23 b to 16</text>
<text x="957.2" y="50">legend:</text>
<text x="957.2" y="64">blue = pair -> join ts_k (p2p, 1024 b,</text>
<text x="957.2" y="78">  bit-exact s0[511:0]|s1[511:0])</text>
<text x="957.2" y="92">green dashed = broadcast (pv2/pe2/bc)</text>
<text x="957.2" y="106">orange = join result to face</text>
<text x="957.2" y="120">rule A: S-face partner in near-S slot,</text>
<text x="957.2" y="134">  N-face partner near-N, W/E far</text>
<text x="957.2" y="148">rule B (pair x-mirror != join x-mirror):</text>
<text x="957.2" y="162">  N/S partners in the far slots,</text>
<text x="957.2" y="176">  W/E near (room to untwist the</text>
<text x="957.2" y="190">  reversed bit order over the pair)</text>
<text x="957.2" y="204">slot orients kept (die islands, ft sites)</text>
<text x="957.2" y="218">join keeps its x-mirror (M3/M5 tracks)</text>
