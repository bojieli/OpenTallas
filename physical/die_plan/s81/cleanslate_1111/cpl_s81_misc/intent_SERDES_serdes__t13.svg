<text x="1052.0" y="71.0" font-size="9">2. SYN -> u_chn 320b p2p k_* into chn W face</text>
<text x="1052.0" y="84.0" font-size="9">3. u_chn -> OUT 559b p2p cw_q/apply/o_ne/fs from chn N face -> u_out</text>
