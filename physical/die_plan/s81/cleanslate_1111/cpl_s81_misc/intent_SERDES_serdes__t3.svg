<text x="1052.0" y="58.0" font-size="9">1. PMA rx -> SYN 320b p2p PMA symbols -> u_syn (soft)</text>
<text x="1052.0" y="71.0" font-size="9">2. SYN -> u_chn 320b p2p k_* into chn W face</text>
<text x="1052.0" y="84.0" font-size="9">3. u_chn -> OUT 559b p2p cw_q/apply/o_ne/fs from chn N face -> u_out</text>
<text x="1052.0" y="97.0" font-size="9">4. dmem -> OUT 544b p2p delay-line data (SRAM W pins)</text>
<text x="1052.0" y="110.0" font-size="9">5. u_chn -> OUT 64b p2p status n_corr/n_unc</text>
