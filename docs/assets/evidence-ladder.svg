<text x="113" y="818" fill="#ff7182" fill-opacity="1" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="750" text-anchor="middle" >7</text>
<text x="160" y="803" fill="#edf5ff" fill-opacity="1" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="750" text-anchor="start" >TEST SILICON</text>
<text x="160" y="829" fill="#9fb3ca" fill-opacity="1" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" >manufacturing, yield, repair exhaustion, silicon correlation</text>
