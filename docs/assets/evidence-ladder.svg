<circle cx="113" cy="355" r="24" fill="#62d6a4" fill-opacity=".16" stroke="#62d6a4" stroke-width="2"/>
<text x="113" y="363" fill="#62d6a4" fill-opacity="1" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="750" text-anchor="middle" >2</text>
<text x="160" y="348" fill="#edf5ff" fill-opacity="1" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="750" text-anchor="start" >ARCHITECTURE SIMULATION</text>
<text x="160" y="374" fill="#9fb3ca" fill-opacity="1" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" >capacity, bandwidth, compute, NoC, pipeline, thermal envelopes</text>
