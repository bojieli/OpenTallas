<text x="160" y="530" fill="#edf5ff" fill-opacity="1" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="750" text-anchor="start" >LOCAL ROM METHOD</text>
<text x="160" y="556" fill="#9fb3ca" fill-opacity="1" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" >two open-PDK layouts, DRC/LVS/PEX, PVT and detailed-RC simulation</text>
<rect x="1350" y="518" width="145" height="38" rx="19" fill="#62d6a4" fill-opacity="0.13" stroke="#62d6a4" stroke-width="1" />
<text x="1422" y="544" fill="#62d6a4" fill-opacity="1" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="750" text-anchor="middle" >PASS</text>
<rect x="70" y="589" width="1460" height="78" rx="14" fill="#0f1d30" fill-opacity="1" stroke="#263b55" stroke-width="1" />
<circle cx="113" cy="628" r="24" fill="#f5c85b" fill-opacity=".16" stroke="#f5c85b" stroke-width="2"/>
<text x="113" y="636" fill="#f5c85b" fill-opacity="1" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="750" text-anchor="middle" >5</text>
<text x="160" y="621" fill="#edf5ff" fill-opacity="1" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="750" text-anchor="start" >DIGITAL PHYSICAL PROXY</text>
<text x="160" y="647" fill="#9fb3ca" fill-opacity="1" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" >one ASAP7 integer numeric block routed; campaign is 1/3 and noncanonical</text>
<rect x="1350" y="609" width="145" height="38" rx="19" fill="#f5c85b" fill-opacity="0.13" stroke="#f5c85b" stroke-width="1" />
<text x="1422" y="635" fill="#f5c85b" fill-opacity="1" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="750" text-anchor="middle" >PARTIAL</text>
<rect x="70" y="680" width="1460" height="78" rx="14" fill="#0f1d30" fill-opacity="1" stroke="#263b55" stroke-width="1" />
<circle cx="113" cy="719" r="24" fill="#ff7182" fill-opacity=".16" stroke="#ff7182" stroke-width="2"/>
<text x="113" y="727" fill="#ff7182" fill-opacity="1" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="750" text-anchor="middle" >6</text>
<text x="160" y="712" fill="#edf5ff" fill-opacity="1" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="750" text-anchor="start" >TARGET IMPLEMENTATION</text>
<text x="160" y="738" fill="#9fb3ca" fill-opacity="1" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" >target formats, ROM macro, full stage, NoC, HBM/package, PI/thermal</text>
<rect x="1350" y="700" width="145" height="38" rx="19" fill="#ff7182" fill-opacity="0.13" stroke="#ff7182" stroke-width="1" />
<text x="1422" y="726" fill="#ff7182" fill-opacity="1" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="750" text-anchor="middle" >OPEN</text>
