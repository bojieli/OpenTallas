<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">OpenTallas evidence ladder</title>
  <desc id="desc">A seven-step evidence ladder showing completed model accounting, architecture simulation, public RTL and local open-PDK methods; partial digital physical work; and open target implementation and silicon stages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0b1b2d"/></linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#35d4c7" stop-opacity=".28"/><stop offset="1" stop-color="#5aa7ff" stop-opacity=".08"/></linearGradient>
    <pattern id="microGrid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#29415d" stroke-width="1" opacity=".34"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".25"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5aa7ff"/></marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#35d4c7"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect x="70" y="48" width="190" height="38" rx="19" fill="#5aa7ff" fill-opacity="0.13" stroke="#5aa7ff" stroke-width="1" />
<text x="165.0" y="74" fill="#5aa7ff" fill-opacity="1" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1.4">EVIDENCE STATUS</text>
<text x="70" y="124" fill="#edf5ff" fill-opacity="1" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="48" font-weight="750" text-anchor="start" >How far has OpenTallas actually progressed?</text>
<text x="70" y="168" fill="#9fb3ca" fill-opacity="1" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" >Green means repository evidence exists. Amber is partial. Red names work that still requires target technology or silicon.</text>
<rect x="70" y="225" width="1460" height="78" rx="14" fill="#0f1d30" fill-opacity="1" stroke="#263b55" stroke-width="1" />
<circle cx="113" cy="264" r="24" fill="#62d6a4" fill-opacity=".16" stroke="#62d6a4" stroke-width="2"/>
<text x="113" y="272" fill="#62d6a4" fill-opacity="1" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="750" text-anchor="middle" >1</text>
<text x="160" y="257" fill="#edf5ff" fill-opacity="1" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="750" text-anchor="start" >MODEL ACCOUNTING</text>
<text x="160" y="283" fill="#9fb3ca" fill-opacity="1" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" >exact checkpoint bytes, operator shapes, KV traffic</text>
<rect x="1350" y="245" width="145" height="38" rx="19" fill="#62d6a4" fill-opacity="0.13" stroke="#62d6a4" stroke-width="1" />
<text x="1422" y="271" fill="#62d6a4" fill-opacity="1" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="750" text-anchor="middle" >DONE</text>
