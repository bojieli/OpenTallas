<text x="1422" y="362" fill="#62d6a4" fill-opacity="1" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="750" text-anchor="middle" >DONE</text>
<rect x="70" y="407" width="1460" height="78" rx="14" fill="#0f1d30" fill-opacity="1" stroke="#263b55" stroke-width="1" />
<circle cx="113" cy="446" r="24" fill="#62d6a4" fill-opacity=".16" stroke="#62d6a4" stroke-width="2"/>
<text x="113" y="454" fill="#62d6a4" fill-opacity="1" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="750" text-anchor="middle" >3</text>
<text x="160" y="439" fill="#edf5ff" fill-opacity="1" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="750" text-anchor="start" >PUBLIC RTL</text>
<text x="160" y="465" fill="#9fb3ca" fill-opacity="1" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" >dual simulation, 9 formal harnesses, coverage, static checks, 87 directed fault sites</text>
<rect x="1350" y="427" width="145" height="38" rx="19" fill="#62d6a4" fill-opacity="0.13" stroke="#62d6a4" stroke-width="1" />
<text x="1422" y="453" fill="#62d6a4" fill-opacity="1" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="750" text-anchor="middle" >PASS</text>
<rect x="70" y="498" width="1460" height="78" rx="14" fill="#0f1d30" fill-opacity="1" stroke="#263b55" stroke-width="1" />
