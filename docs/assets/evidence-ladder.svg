<text x="1422" y="817" fill="#ff7182" fill-opacity="1" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="750" text-anchor="middle" >NOT BUILT</text>
<text x="70" y="874" fill="#9fb3ca" fill-opacity="1" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" >ASAP7 completed cases: 3/3 · no full chip, wafer, target ROM macro, or fabricated OpenTallas silicon exists</text>
</svg>
