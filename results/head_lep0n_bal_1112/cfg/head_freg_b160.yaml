# DH58-PROTO 11-03: copy of die-head-48 clk/head_l48c.yaml (the l48w/sth die clock form) with plan = l48rf; region map + feed = the committed repo copies (die-head-33/start/clk/in originals pruned).
# ot-clk config: HEAD die clock on the CURRENT plan hk4 RX/TX raw event (results/die_head_21_1028/hk4/plan_spine_raw_rx_tx.json.gz,
# 21 types / 351 parts / 327 regions; DIE-HEAD-24 06:01 plan statement).  DIE-HEAD-25 2026-10-29: local form (12.13b/12.16e) =
# region clocks forwarded along the Codex neighbour feed graph (hk4/clock_local2/feed.json, root sp3, 326 edges) with a balanced
# H-tree per region (link_htree) + DME delay regions, replacing the HEAD-only head_strip_local_clock.py build (12.17(2)).
# Stage model: borrowed QC inv2/NDR entry (same stack key); a HEAD refit (ot_clk.py refit on the routed legs) is the follow-up.
# DIE-HEAD-26 2026-10-29: stack inv2 (pairs, rep 250) -> inv (single CKINVDCx16, rep 150) = the KV inverter form.  Reason: the
# inv2 pair (short leg + long leg) is an unequal stage pair, so its edge distortion accumulates (fall-rise 0.3-0.7 ps/stage,
# 154 stages -> duty 56 %/62 % TT/FF, 88/226 taps outside 45-55).  Equal single-inverter stages cancel edge by edge:
# 0/735 outside TT+FF (results/die_head_26_1029/clk).  Stage model = HEAD refit inv_ndr_head26_i150 (ot_clk refit on the
# routed legs of the kv21-model build i150; 1143 legs, rms 6.35 TT / 5.70 FF ps).
