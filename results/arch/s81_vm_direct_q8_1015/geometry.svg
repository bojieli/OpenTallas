" font-size="13">1,248 endpoints; worst 443.982 µm; over 500: 0</text><text x="605" y="399" font-size="13">7,464 writer endpoint bits per microcluster.</text><text x="605" y="422" font-size="13">16 microclusters per VM512 (four per slice).</text><text x="605" y="445" font-size="13">Source bank ownership eliminates pooled scatter traffic.</text><text x="605" y="468" font-size="13">SOUTH drain pins remove storage-output U-turns.</text><text x="605" y="491" font-size="13">Local banks, q4 and b8 keep source layout vectors.</text><text x="605" y="600" font-size="16">Still open at the system boundary</text><text x="605" y="627" font-size="13">W0 payload/header/control distribution and ages</text><text x="605" y="650" font-size="13">Read issue, return repair and global fault trees</text><text x="605" y="673" font-size="13">Additional VM cap16 / CDC16 / x34 hardware</text><text x="605" y="696" font-size="13">Native pin IO, clock / phi-R, PG and route closure</text><text x="605" y="719" font-size="13">Full traffic cuts and all 81-stage activity binding</text><text x="30" y="756" font-size="13">Bundle lines show direction by source → target; they are connectivity overlays, not detailed route guides.</text><text x="30" y="780" font-size="13">This local proof does not qualify complete VM packing or the die. Historical 164 / 188 / 200-node system figures are superseded.</text></g></svg>