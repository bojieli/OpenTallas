  <figcaption><b>Figure R-5. Head-die draft-KV memory (gate C10).</b> Each head die holds the 28-user fill's draft windows (3 blocks x 128 rows x 528 B per user, a quarter per die, double-buffered) in 112 macros from this repository's ASAP7 SRAM compiler (ot_sram_1r1w_1024x256_m2_r2c2: 32 KB, 1R1W, 2 spare rows and columns), placed in the right-sized head die's released engine area, so no ROM is displaced. Four banks of 28 macros; a user slot is interleaved across one bank, giving the drafter's attention a 7,168-bit read port (a stage's window in 21 cycles) and an independent write port, and four users can read at once. Users beyond the fill page to the head die's 4 HBM3E stacks. Macro geometry and timing come from the compiler's datasheet; the halo, the bus channel and the wire delay are estimates, and nothing here is routed.</figcaption>
</figure>
