  <figcaption><b>Figure R-1. Logical map of the 188 dies.</b> The token circulates a ring of 29 stage modules: 28 layer stages (S0-S27, one tensor group of 4 dies = one package pair each, 40 layers cut at equal bytes) and the head + embedding + DSpark group H, whose argmax winner reads the next embedding row locally and returns it to S0 over one ring hop. Tensor collectives stay inside a module (UCIe between the dies of a package, a ~120 mm board trace between the two packages); only the 40 KB residual crosses a cable. The 72 table dies hold the two Engram tables and sit off the stage path behind one switch: their gather is prefetched from the token id and lands within layer 1's slack. Die roles: <code>results/arch/v41_die_placement.json</code>; traffic: <code>results/arch/v41_rack.json</code>.</figcaption>

  <figcaption><b>Figure R-2. One model replica per rack.</b> Left: the ORv3 front elevation. The 15 stage trays fold the token ring (tray t holds ring positions t and 28-t), so every ring neighbour is on the same or the adjacent tray and every stage hop is one passive copper cable of at most 0.80 m, with no retimer. Right: a stage tray carries two stage modules; each module board carries one tensor group (a package pair) with the TP link as a ~120 mm trace. Power uses validated static values (logic leakage 0.10 W/mm2, HBM idle, SerDes at 6.5 pJ/b) and the spec's dynamic model with validated MAC energies, through 87% voltage regulation, 96% PSUs and 3% fans, provisioned at 1.2x the worst case; weight is an estimate. Sources in <code>results/arch/v41_rack.json</code> <code>physical_constants</code>.</figcaption>

  <figcaption><b>Figure R-3. Five link tiers.</b> Latency is the hardware floor per hop, on values validated against normative specs and production datasheets. The on-module trace (T1) keeps the 130 ns light-FEC link (an OIF CEI-112G-MR channel), re-based to its ~120 mm of trace at 6.7 ns/m. The ring cables (T2) run full RS(544,514) KP4, 209 ns, because a light FEC is not qualified on CR-class copper; their flight (4.6 ns/m) is added on top. The switched tier pays two full-KP4 Ethernet ports and 250 ns of switch. Bandwidth is per link and direction on the lane allocation TP 52 / stage 14 + 14 / switch 4 / spare 6 of the package's 90 lanes (R-L9, results/arch/v41_lanes.json). Reach classes: UCIe (Hot Chips 2023 tutorial), OIF CEI-112G, IEEE 802.3ck, Credo AEC.</figcaption>
</figure>

  <figcaption><b>Figure R-4. What each rack is built for.</b> NVL72 and CloudMatrix384 build an all-to-all scale-up fabric (NVLink switch trays; a two-tier Unified Bus across 16 racks) because any model, and expert parallelism in particular, needs every accelerator to reach every other. The ROM rack serves one fixed model whose weights never move: its only on-path traffic is a 40 KB residual per stage hop and 20 KB collectives inside a package pair, so it needs point-to-point copper and no scale-up switch, at about a fifth of an NVL72's power; its per-package lanes (90 x 112G) are spent on 116 point-to-point 8-lane ring cables and on-board traces, not on a switch. Sources: NVIDIA GB200 NVL72 product page and DGX GB200 user guide (120 kW, 1.36 t, 5,000 copper cables); arXiv:2506.12708 and SemiAnalysis (CloudMatrix384; 559 kW is SemiAnalysis's figure).</figcaption>
</figure>

  <figcaption><b>Figure R-5. Head-die draft-KV memory (gate C10).</b> Each head die holds the 28-user fill's draft windows (3 blocks x 128 rows x 528 B per user, a quarter per die, double-buffered) in 112 macros from this repository's ASAP7 SRAM compiler (ot_sram_1r1w_1024x256_m2_r2c2: 32 KB, 1R1W, 2 spare rows and columns). One 4-macro row per user slot gives the drafter's attention a 1,024-bit read port and an independent write port. Users beyond the fill page to the head die's 4 HBM3E stacks. Macro geometry and timing come from the compiler's datasheet; the halo, the bus channel and the wire delay are estimates, and nothing here is routed.</figcaption>
