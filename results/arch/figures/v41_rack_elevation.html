  <figcaption><b>Figure R-2. One model replica per rack.</b> Left: the ORv3 front elevation. The 15 stage trays fold the token ring (tray t holds ring positions t and 28-t), so every ring neighbour is on the same or the adjacent tray and every stage hop is one passive copper cable of at most 0.80 m, with no retimer. Right: a stage tray carries two stage modules; each module board carries one tensor group (a package pair) with the TP link as a ~120 mm trace. Power uses validated static values (logic leakage 0.10 W/mm2, HBM idle, SerDes at 6.5 pJ/b) and the spec's dynamic model with validated MAC energies, through 87% voltage regulation, 96% PSUs and 3% fans, provisioned at 1.2x the worst case; weight is an estimate. Sources in <code>results/arch/v41_rack.json</code> <code>physical_constants</code>.</figcaption>
