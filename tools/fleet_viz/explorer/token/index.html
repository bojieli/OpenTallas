<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenTallas Token Explorer</title>
<link rel="stylesheet" href="/explorer/dataflow/dataflow.css">
<style>
  :root { color-scheme:dark; }
  * { box-sizing:border-box; }
  html,body { margin:0;background:#05070d;color:#e8eefc; }
  body { font:14px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased; }
  header { display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;border-bottom:1px solid #1b2540;background:#070b16;flex:none; }
  header h1 { font-size:18px;margin:0;font-weight:800;letter-spacing:-.02em; }
  header h1 span { color:#5ee7ff; }
  header p { margin:0;color:#8a97b8;font-size:12px;flex:1 1 260px; }
  header a { color:#8a97b8;text-decoration:none;font:600 12px ui-monospace,Menlo,monospace;border:1px solid #1b2540;border-radius:999px;padding:5px 10px;white-space:nowrap; }
  header a:hover { color:#5ee7ff;border-color:#4a5678; }
  main,#app { flex:1;min-height:0;display:flex;flex-direction:column; }
  #err { color:#e66767;font:13px ui-monospace,Menlo,monospace;white-space:pre-wrap; }
  #err:empty { display:none; }
  #now { flex:none;border-bottom:1px solid #1b2540;background:#0a1020;padding:6px 16px;font-size:12px;color:#c9d4ee;max-height:38vh;overflow:auto; }
  #now summary { cursor:pointer;color:#fbbf24;font-weight:700; }
  #now li { margin:2px 0; } #now code { color:#5ee7ff; } #now .dim { color:#8a97b8; }
  @media(max-width:760px) { header { padding:8px 10px;gap:6px 10px; } header p { display:none; } header h1 { font-size:16px;flex:1 1 100%; } }
</style>
</head>
<body>
<header>
  <h1>OpenTallas <span>Token Explorer</span></h1>
  <p>One token, from stage to operator · critical path, timing and hardware evidence</p>
  <a href="/explorer">← Chip Explorer</a> <a href="/explorer/coverage/">Coverage →</a>
</header>
<details id="now"><summary>Current token-pass state (loading…)</summary><div id="nowBody"></div></details>
<main><div id="app"></div><div id="err"></div></main>
<script type="module">
import { mountTokenExplorer, DESIGNS, canonDesign } from './token.js';
const parse = () => {
  const q = Object.fromEntries(location.hash.slice(1).split('&').filter(Boolean).map((kv) => kv.split('=').map(decodeURIComponent)));
  if (q.design && canonDesign(q.design) !== q.design) { q.design = canonDesign(q.design); q.group = null; if (q.mode === 'mtp') q.mode = null; }
  return q;
};
const h0 = parse();
const design = DESIGNS.some((d) => d.id === h0.design) ? h0.design : 'qwen_rom';
let api;
try {
  api = await mountTokenExplorer(document.getElementById('app'), {
    base: './data/', design, group: h0.group || null, mode: h0.mode === 'mtp' ? 'mtp' : 'ar',
    onState: (s) => { const want = '#design=' + s.design + (s.mode === 'mtp' ? '&mode=mtp' : '') + (s.group ? '&group=' + encodeURIComponent(s.group) : ''); if (location.hash !== want) history.replaceState(null, '', want); },
  });
  window.tokenPath = api;
} catch (e) { document.getElementById('err').textContent = 'token path: ' + e.message; }
window.addEventListener('hashchange', () => {
  const q = parse();
  const md = q.mode === 'mtp' ? 'mtp' : 'ar';
  if (api && q.design && (q.design !== api.state.design || (q.group || null) !== api.state.group || md !== api.state.mode)) api.show(q.design, q.group || null, md);
});
</script>
<script>
// WEBVIEW-1 11-03: the token-path models below are analytic records (dated); today's token-pass state comes from
// RELEASE_TREE.md (TOK.* lines) and results/token_pass on origin/main via /api/plan_now (plan_now.py, every 30 min).
(async () => {
  const esc = (x) => String(x ?? '').replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  const day = (t) => t ? new Date(t * 1000).toLocaleString('en-US', {month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false}) : '?';
  try {
    const r = await fetch('/api/plan_now', {cache: 'no-store'});
    let d = null; try { d = r.ok ? await r.json() : null; } catch (_) { d = null; }
    if (!d || !d.token) {   // no plan_now.json on this server (or not JSON): say so plainly, not as a parse error
      document.querySelector('#now summary').textContent = 'Current token-pass state: no token-pass run recorded on this server' + (r.ok ? '' : ` (/api/plan_now HTTP ${r.status})`) + ' — the token-path model below is the analytic record, not a token pass';
      return;
    }
    const t = d.token;
    const old = (t.models || []).map((m) => m.mtime); const newest = old.length ? Math.max(...old) : 0;
    document.querySelector('#now summary').textContent = `Current token-pass state · release tree ${day(t.release_mtime)} · trunk ${d.repo && d.repo.origin_main} — the token-path model below is the analytic record of ${day(newest)}, not a token pass`;
    document.getElementById('nowBody').innerHTML = '<ul>' + (t.release_lines || []).map((l) => `<li>${esc(l)}</li>`).join('') + '</ul>' +
      '<div class="dim">Newest results/token_pass records on origin/main:</div><ul>' +
      (t.token_pass || []).slice(0, 12).map((r) => `<li><code>${esc(r.dir.replace('results/token_pass/', ''))}</code> <span class="dim">${esc(r.date.slice(0, 16))} ${esc(r.commit)}</span> ${esc(r.readme || '')}</li>`).join('') + '</ul>';
  } catch (e) { document.querySelector('#now summary').textContent = 'Current token-pass state: unavailable (' + e.message + ')'; }
})();
</script>
</body>
</html>
