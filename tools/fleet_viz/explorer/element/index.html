<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Element Layout</title>
<meta name="description" content="The real routed layout of one closed OpenTallas element: module hierarchy, worst timing paths, clock tree, density and sign-off facts, each traced to its record">
<style>
:root{
  --bg:#05070d; --panel:#0b1020; --panel2:#0f1629; --line:#1b2540; --ink:#e8eefc; --dim:#8a97b8; --faint:#4a5678;
  --accent:#5ee7ff; --ok:#4ade80; --warn:#fbbf24; --hot:#ff5d73; --story:#ffd23f;
  --canvas:#03050b; --die:#1b2540; --core:#2a3558; --macro:#a78bfa; --cellgrey:#8a97b8; --tree:#5ee7ff; --path:#ff5d73; --hold:#fbbf24;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --hover:#16244a; --rowline:#121a30; --tipbg:#0b1020f2; --topbg:#070b16cc;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f7fb; --panel:#ffffff; --panel2:#eef2f9; --line:#d5dcea; --ink:#0e1526; --dim:#4c5a78; --faint:#8592ad;
    --accent:#0a7ea4; --ok:#15803d; --warn:#b45309; --hot:#c8102e; --story:#9a6a00;
    --canvas:#fbfcfe; --die:#c9d2e3; --core:#9fb0cc; --macro:#7c3aed; --cellgrey:#5d6b88; --tree:#0a7ea4; --path:#c8102e; --hold:#b45309;
    --hover:#e3eaf7; --rowline:#e6ebf4; --tipbg:#fffffff2; --topbg:#ffffffd9; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f5f7fb; --panel:#ffffff; --panel2:#eef2f9; --line:#d5dcea; --ink:#0e1526; --dim:#4c5a78; --faint:#8592ad;
  --accent:#0a7ea4; --ok:#15803d; --warn:#b45309; --hot:#c8102e; --story:#9a6a00;
  --canvas:#fbfcfe; --die:#c9d2e3; --core:#9fb0cc; --macro:#7c3aed; --cellgrey:#5d6b88; --tree:#0a7ea4; --path:#c8102e; --hold:#b45309;
  --hover:#e3eaf7; --rowline:#e6ebf4; --tipbg:#fffffff2; --topbg:#ffffffd9; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;flex-direction:column}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--topbg);position:sticky;top:0;z-index:20;backdrop-filter:blur(6px)}
h1{margin:0;font:800 17px var(--mono);letter-spacing:-.01em;min-width:0;overflow-wrap:anywhere}
.back{font:600 12px var(--mono);text-decoration:none;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap}
.back:hover{color:var(--ink)}
.sp{flex:1 1 auto}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{background:none;border:0;border-right:1px solid var(--line);padding:6px 10px;font:600 12px var(--sans);color:var(--dim);cursor:pointer;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--hover);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font:600 12px var(--sans);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.how{background:linear-gradient(90deg,#3a2f7a,#1a1440);border:1px solid #5b4bc4;color:#fff;border-radius:999px;padding:7px 14px;font:700 13px var(--sans);cursor:pointer;white-space:nowrap}
:root[data-theme="light"] .how{background:linear-gradient(90deg,#5b4bc4,#7c6be0)}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .how{background:linear-gradient(90deg,#5b4bc4,#7c6be0)} }
.how:hover{filter:brightness(1.15)}
.summary{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.summary p{margin:0;font-size:14.5px;line-height:1.5;flex:1 1 420px;min-width:0}
.pills{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--line)}
.bd{display:inline-flex;align-items:center;gap:5px;font:700 10.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:6px;border:1px solid currentColor;white-space:nowrap}
.bd i{width:7px;height:7px;border-radius:2px;background:currentColor}
.chip{font:600 11px var(--mono);color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.ok{color:var(--ok)} .ng{color:var(--hot)} .wn{color:var(--warn)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 440px;flex:1 1 auto;min-height:0}
.stagewrap{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:560px;min-width:0}
.stage{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:1px;background:var(--line);flex:1 1 auto;min-height:0;position:relative}
.stage.rows{grid-auto-flow:row;grid-auto-rows:minmax(0,1fr);grid-auto-columns:auto}
.pane{position:relative;background:var(--canvas);min-width:0;min-height:300px;overflow:hidden}
.pane canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
.pane canvas.drag{cursor:grabbing}
.ph{position:absolute;left:8px;top:8px;right:8px;display:flex;gap:6px;align-items:flex-start;z-index:3;pointer-events:none}
.ph .lab{background:var(--tipbg);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:11px var(--mono);color:var(--dim);line-height:1.45;pointer-events:auto;max-width:100%}
.ph .lab b{color:var(--ink);font-size:12px}
.pz{position:absolute;right:8px;bottom:8px;z-index:3;display:flex;gap:4px}
.pz button{width:28px;height:28px;padding:0;border-radius:7px}
.scale{position:absolute;left:8px;bottom:8px;z-index:3;font:10.5px var(--mono);color:var(--dim);background:var(--tipbg);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.busy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 13px var(--mono);color:var(--dim);z-index:2;text-align:center;padding:20px}
.side{border-left:1px solid var(--line);background:var(--panel);overflow:auto;min-width:0;max-height:calc(100vh - 150px);scrollbar-width:thin}
.sec{padding:12px 14px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 8px;font:700 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sec h3 .u{text-transform:none;letter-spacing:0;color:var(--dim);font-weight:600}
h4.sub{margin:16px 0 8px;font:700 12px var(--sans);color:var(--ink);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
h4.sub:first-of-type{margin-top:4px}
h4.sub .u{font:500 12px var(--sans);color:var(--dim)}
.sec p,.note{margin:0 0 6px;font-size:12px;color:var(--dim);line-height:1.5}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{font:700 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);text-align:left;padding:4px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:3px 5px;border-bottom:1px solid var(--rowline);vertical-align:top}
table.t td.n{font-family:var(--mono);text-align:right;white-space:nowrap}
table.t td.m{font-family:var(--mono);font-size:11px;overflow-wrap:anywhere}
table.t td.src,table.t div.src{font-family:var(--mono);font-size:10.5px;color:var(--faint);overflow-wrap:anywhere;margin-top:2px}
table.facts td:last-child{white-space:normal;max-width:48%}
table.t tr.cl{cursor:pointer}
table.t tr.cl:hover,table.t tr.on{background:var(--hover)}
.tw{overflow-x:auto}
.lg{display:flex;flex-direction:column;gap:2px;font:11.5px var(--mono)}
.lg button{display:flex;gap:7px;align-items:center;background:none;border:0;padding:3px 4px;cursor:pointer;text-align:left;border-radius:5px;color:var(--ink)}
.lg button:hover,.lg button.on{background:var(--hover)}
.lg button.off{opacity:.35}
.lg button .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lg button small{margin-left:auto;color:var(--faint);padding-left:6px;white-space:nowrap}
.sw{width:10px;height:10px;border-radius:2px;flex:none;display:inline-block}
.ramp{height:10px;border-radius:3px;margin:4px 0 2px}
.rampl{display:flex;justify-content:space-between;font:10.5px var(--mono);color:var(--dim)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;font-size:12px}
.kv dt{color:var(--dim)} .kv dd{margin:0;font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere}
.ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.ctl label{font-size:12px;color:var(--dim)}
select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:4px 7px;font:12px var(--sans)}
svg.hist{width:100%;display:block}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--tipbg);border:1px solid var(--line);border-radius:9px;padding:7px 9px;font:12px var(--sans);max-width:360px;box-shadow:0 10px 30px #0006;color:var(--ink)}
#tip .n{font:700 12px var(--mono);word-break:break-all}
#tip .m{color:var(--dim);font:11.5px var(--mono);margin-top:2px;word-break:break-all;line-height:1.45}
/* story */
.storybar{flex:none;z-index:6;background:var(--panel);border-top:2px solid #5b4bc4;padding:12px 16px;display:flex;flex-direction:column;gap:6px;max-height:42vh;overflow:auto}
.facts .fact{padding:5px 0;border-bottom:1px solid var(--rowline)}
.facts .fr{display:flex;gap:10px;justify-content:space-between;font-size:12px}
.facts .fr b{font:600 11.5px var(--mono);text-align:right;overflow-wrap:anywhere}
.facts .src{font:10.5px var(--mono);color:var(--faint);overflow-wrap:anywhere;margin-top:2px}
.storybar .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.storybar .ctr{font:600 11.5px var(--mono);color:var(--dim)}
.storybar h4{margin:0;font:700 16px var(--sans)}
.storybar .cap{margin:0;font-size:14.5px;line-height:1.5;overflow-wrap:anywhere}
.storybar .why{margin:0;font-size:13px;line-height:1.5;color:var(--dim);overflow-wrap:anywhere}
.storybar .why b{color:var(--story)}
.storybar .lnk{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font:600 12.5px var(--sans);text-decoration:underline;text-align:left}
.dots{display:flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.dots i.on{background:var(--story)}
body.story .side{opacity:.55}
body.story .lensbar{opacity:.5;pointer-events:none}
@media (max-width: 980px){
  body.tab-rtl .main{grid-template-columns:minmax(0,1fr)}
  .main{grid-template-columns:minmax(0,1fr)}
  .side{border-left:0;border-top:1px solid var(--line);max-height:none}
  .stagewrap{height:auto;min-height:0}
  .stage,.stage.rows{grid-auto-flow:row;grid-auto-rows:minmax(220px,34vh);min-height:0}
  .storybar{max-height:none}
  body.story .stage{grid-auto-rows:minmax(200px,30vh)}
  body.story .side{display:none}
}
@media (max-width: 520px){
  .top{padding:8px 12px} .summary,.pills{padding-left:12px;padding-right:12px}
  .seg button{padding:6px 8px}
  h1{font-size:15px}
}

/* tab bar */
.tabbar{position:sticky;top:49px;z-index:19;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px 6px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px 7px;font:650 15px var(--sans);color:var(--dim);cursor:pointer;white-space:nowrap;border-radius:8px 8px 0 0}
.tabs button:hover{color:var(--ink);background:var(--hover)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);background:var(--hover)}
.tabdesc{margin:6px 2px 0;font-size:13px;color:var(--dim)}
.lbl{display:inline-block;font:700 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;border:1px solid currentColor}
.lbl.ver{color:var(--ok)} .lbl.unv{color:var(--warn)} .lbl.pend{color:var(--dim)} .lbl.bad{color:var(--hot)}
ol.sumy{margin:4px 0 0;padding-left:22px;font-size:13.5px;line-height:1.55}
ol.sumy li{margin:0 0 4px}
.rl{font:11.5px var(--mono);color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.code{font:12px/1.5 var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:440px;margin:0}
.code table{border-collapse:collapse;width:100%}
.code td.ln{color:var(--faint);text-align:right;padding:0 10px 0 8px;user-select:none;vertical-align:top;width:1%;white-space:nowrap}
.code td.lc{white-space:pre;padding-right:12px}
.code tr.hl td{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.tk-k{color:#c678dd}.tk-c{color:var(--faint);font-style:italic}.tk-n{color:#d19a66}.tk-s{color:#98c379}.tk-d{color:#61afef}
:root[data-theme="light"] .tk-k{color:#7c3aed}:root[data-theme="light"] .tk-n{color:#b45309}:root[data-theme="light"] .tk-s{color:#15803d}:root[data-theme="light"] .tk-d{color:#0a7ea4}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .tk-k{color:#7c3aed}:root:not([data-theme="dark"]) .tk-n{color:#b45309}:root:not([data-theme="dark"]) .tk-s{color:#15803d}:root:not([data-theme="dark"]) .tk-d{color:#0a7ea4}}
.vbox{overflow-wrap:anywhere;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel2);font-size:13px;line-height:1.55}
.vbox p{font-size:13px}
.diag{width:100%;display:block}
.diag .blk rect{fill:var(--panel2);stroke:var(--line)}
.diag .blk:hover rect{stroke:var(--accent)}
.diag text{font-family:var(--mono)}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.crumbs button{font:600 11.5px var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--dim);cursor:pointer}
.crumbs button[aria-pressed="true"]{color:var(--ink);border-color:var(--accent)}
/* rtl */
body.tab-rtl .main{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
.mtree{font:12px var(--mono);max-height:34vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px 0;background:var(--panel2)}
.mtree .nd{display:flex;gap:6px;align-items:center;padding:2px 8px;cursor:pointer;white-space:nowrap}
.mtree .nd:hover{background:var(--hover)} .mtree .nd.on{background:var(--hover);box-shadow:inset 3px 0 0 var(--accent)}
.mtree .nd .tw2{width:12px;color:var(--faint);flex:none;text-align:center}
.mtree .nd small{color:var(--faint);margin-left:auto;padding-left:8px}
.mtree .nd .mm{color:var(--dim)}
.dendro{width:100%;display:block}
@media (max-width: 980px){ .tabbar{position:relative;top:0} .tabs button{font-size:14px;padding:7px 10px}

  body.tab-rtl .main{grid-template-columns:minmax(0,1fr)} }
</style>
</head>
<body>
<div class="top">
  <a class="back" href="/explorer">&larr; Chip Explorer</a>
  <h1 id="title">Element</h1>
  <span class="sp"></span>
  <button class="btn" id="theme" type="button" title="Switch light / dark">Theme</button>
</div>
<nav class="tabbar" aria-label="Element views"><div class="tabs" role="tablist" id="tabs"></div><p class="tabdesc" id="tabdesc"></p></nav>
<div class="summary"><p id="sum">Loading&hellip;</p></div>
<div class="pills" id="pills"></div>
<div class="main" id="main">
  <div class="stagewrap"><div class="stage" id="stage"></div></div>
  <aside class="side" id="side" aria-label="Detail"></aside>
</div>
<div id="tip" hidden></div>
<script src="elem.js"></script>
</body>
</html>
