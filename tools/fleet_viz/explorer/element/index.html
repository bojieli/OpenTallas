<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Element Layout</title>
<meta name="description" content="The real routed layout of one closed OpenTallas element: module hierarchy, worst timing paths, clock tree, density and sign-off facts, each traced to its record">
<style>
:root{
  --bg:#05070d; --panel:#0b1020; --panel2:#0f1629; --line:#1b2540; --ink:#e8eefc; --dim:#8a97b8; --faint:#4a5678;
  --accent:#5ee7ff; --ok:#4ade80; --warn:#fbbf24; --hot:#ff5d73; --story:#ffd23f;
  --canvas:#03050b; --die:#1b2540; --core:#2a3558; --macro:#a78bfa; --cellgrey:#8a97b8; --tree:#5ee7ff; --path:#ff5d73; --hold:#fbbf24;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --hover:#16244a; --rowline:#121a30; --tipbg:#0b1020f2; --topbg:#070b16cc;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f7fb; --panel:#ffffff; --panel2:#eef2f9; --line:#d5dcea; --ink:#0e1526; --dim:#4c5a78; --faint:#8592ad;
    --accent:#0a7ea4; --ok:#15803d; --warn:#b45309; --hot:#c8102e; --story:#9a6a00;
    --canvas:#fbfcfe; --die:#c9d2e3; --core:#9fb0cc; --macro:#7c3aed; --cellgrey:#5d6b88; --tree:#0a7ea4; --path:#c8102e; --hold:#b45309;
    --hover:#e3eaf7; --rowline:#e6ebf4; --tipbg:#fffffff2; --topbg:#ffffffd9; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f5f7fb; --panel:#ffffff; --panel2:#eef2f9; --line:#d5dcea; --ink:#0e1526; --dim:#4c5a78; --faint:#8592ad;
  --accent:#0a7ea4; --ok:#15803d; --warn:#b45309; --hot:#c8102e; --story:#9a6a00;
  --canvas:#fbfcfe; --die:#c9d2e3; --core:#9fb0cc; --macro:#7c3aed; --cellgrey:#5d6b88; --tree:#0a7ea4; --path:#c8102e; --hold:#b45309;
  --hover:#e3eaf7; --rowline:#e6ebf4; --tipbg:#fffffff2; --topbg:#ffffffd9; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.top{flex:none;display:flex;align-items:center;gap:6px 10px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--topbg);position:relative;z-index:30;backdrop-filter:blur(6px);min-height:46px}
h1{margin:0;font:800 17px var(--mono);letter-spacing:-.01em;min-width:0;overflow-wrap:anywhere}
.back{font:600 12px var(--mono);text-decoration:none;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap}
.back:hover{color:var(--ink)}
.sp{flex:1 1 auto}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{background:none;border:0;border-right:1px solid var(--line);padding:6px 10px;font:600 12px var(--sans);color:var(--dim);cursor:pointer;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--hover);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font:600 12px var(--sans);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.how{background:linear-gradient(90deg,#3a2f7a,#1a1440);border:1px solid #5b4bc4;color:#fff;border-radius:999px;padding:7px 14px;font:700 13px var(--sans);cursor:pointer;white-space:nowrap}
:root[data-theme="light"] .how{background:linear-gradient(90deg,#5b4bc4,#7c6be0)}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .how{background:linear-gradient(90deg,#5b4bc4,#7c6be0)} }
.how:hover{filter:brightness(1.15)}
.summary{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.summary p{margin:0;font-size:14.5px;line-height:1.5;flex:1 1 420px;min-width:0}
.pills{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--line)}
.bd{display:inline-flex;align-items:center;gap:5px;font:700 10.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:6px;border:1px solid currentColor;white-space:nowrap}
.bd i{width:7px;height:7px;border-radius:2px;background:currentColor}
.chip{font:600 11px var(--mono);color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.ok{color:var(--ok)} .ng{color:var(--hot)} .wn{color:var(--warn)}
.main{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.stagewrap{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;min-width:0}
.stage{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:1px;background:var(--line);flex:1 1 auto;min-height:0;position:relative}
.stage.rows{grid-auto-flow:row;grid-auto-rows:minmax(0,1fr);grid-auto-columns:auto}
.pane{position:relative;background:var(--canvas);min-width:0;min-height:0;overflow:hidden}
.pane canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
.pane canvas.drag{cursor:grabbing}
.ph{position:absolute;left:8px;top:8px;right:8px;display:flex;gap:6px;align-items:flex-start;z-index:3;pointer-events:none}
.ph .lab{background:var(--tipbg);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:11px var(--mono);color:var(--dim);line-height:1.45;pointer-events:auto;max-width:100%}
.ph .lab b{color:var(--ink);font-size:12px}
.pz{position:absolute;right:8px;bottom:8px;z-index:3;display:flex;gap:4px}
.pz button{width:28px;height:28px;padding:0;border-radius:7px}
.scale{position:absolute;left:8px;bottom:8px;z-index:3;font:10.5px var(--mono);color:var(--dim);background:var(--tipbg);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.busy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 13px var(--mono);color:var(--dim);z-index:2;text-align:center;padding:20px}
.side{min-width:0}
.sec{padding:12px 14px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 8px;font:700 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sec h3 .u{text-transform:none;letter-spacing:0;color:var(--dim);font-weight:600}
h4.sub{margin:16px 0 8px;font:700 12px var(--sans);color:var(--ink);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
h4.sub:first-of-type{margin-top:4px}
h4.sub .u{font:500 12px var(--sans);color:var(--dim)}
.sec p,.note{margin:0 0 6px;font-size:12px;color:var(--dim);line-height:1.5}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{font:700 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);text-align:left;padding:4px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:3px 5px;border-bottom:1px solid var(--rowline);vertical-align:top}
table.t td.n{font-family:var(--mono);text-align:right;white-space:nowrap}
table.t td.m{font-family:var(--mono);font-size:11px;overflow-wrap:anywhere}
table.t td.src,table.t div.src{font-family:var(--mono);font-size:10.5px;color:var(--faint);overflow-wrap:anywhere;margin-top:2px}
table.facts td:last-child{white-space:normal;max-width:48%}
table.t tr.cl{cursor:pointer}
table.t tr.cl:hover,table.t tr.on{background:var(--hover)}
.tw{overflow-x:auto}
.lg{display:flex;flex-direction:column;gap:2px;font:11.5px var(--mono)}
.lg button{display:flex;gap:7px;align-items:center;background:none;border:0;padding:3px 4px;cursor:pointer;text-align:left;border-radius:5px;color:var(--ink)}
.lg button:hover,.lg button.on{background:var(--hover)}
.lg button.off{opacity:.35}
.lg button .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lg button small{margin-left:auto;color:var(--faint);padding-left:6px;white-space:nowrap}
.sw{width:10px;height:10px;border-radius:2px;flex:none;display:inline-block}
.ramp{height:10px;border-radius:3px;margin:4px 0 2px}
.rampl{display:flex;justify-content:space-between;font:10.5px var(--mono);color:var(--dim)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;font-size:12px}
.kv dt{color:var(--dim)} .kv dd{margin:0;font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere}
.ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.ctl label{font-size:12px;color:var(--dim)}
select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:4px 7px;font:12px var(--sans)}
svg.hist{width:100%;display:block}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--tipbg);border:1px solid var(--line);border-radius:9px;padding:7px 9px;font:12px var(--sans);max-width:360px;box-shadow:0 10px 30px #0006;color:var(--ink)}
#tip .n{font:700 12px var(--mono);word-break:break-all}
#tip .m{color:var(--dim);font:11.5px var(--mono);margin-top:2px;word-break:break-all;line-height:1.45}
/* story */
.storybar{flex:none;z-index:6;background:var(--panel);border-top:2px solid #5b4bc4;padding:12px 16px;display:flex;flex-direction:column;gap:6px;max-height:42vh;overflow:auto}
.facts .fact{padding:5px 0;border-bottom:1px solid var(--rowline)}
.facts .fr{display:flex;gap:10px;justify-content:space-between;font-size:12px}
.facts .fr b{font:600 11.5px var(--mono);text-align:right;overflow-wrap:anywhere}
.facts .src{font:10.5px var(--mono);color:var(--faint);overflow-wrap:anywhere;margin-top:2px}
.storybar .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.storybar .ctr{font:600 11.5px var(--mono);color:var(--dim)}
.storybar h4{margin:0;font:700 16px var(--sans)}
.storybar .cap{margin:0;font-size:14.5px;line-height:1.5;overflow-wrap:anywhere}
.storybar .why{margin:0;font-size:13px;line-height:1.5;color:var(--dim);overflow-wrap:anywhere}
.storybar .why b{color:var(--story)}
.storybar .lnk{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font:600 12.5px var(--sans);text-decoration:underline;text-align:left}
.dots{display:flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.dots i.on{background:var(--story)}
body.story .side{opacity:.55}
body.story .lensbar{opacity:.5;pointer-events:none}
@media (max-width: 980px){
  .stage.rows{grid-auto-flow:row;grid-auto-rows:minmax(0,1fr)}
}

/* tab bar */
.tabbar{display:flex;align-items:center;gap:4px;min-width:0;flex:1 1 auto;justify-content:center}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;min-width:0;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;padding:5px 11px;font:600 13px var(--sans);color:var(--dim);cursor:pointer;white-space:nowrap;border-radius:7px}
.tabs button:hover{color:var(--ink);background:var(--hover)}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--hover);box-shadow:inset 0 -2px 0 var(--accent)}
.lbl{display:inline-block;font:700 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;border:1px solid currentColor}
.lbl.ver{color:var(--ok)} .lbl.unv{color:var(--warn)} .lbl.pend{color:var(--dim)} .lbl.bad{color:var(--hot)}
ol.sumy{margin:4px 0 0;padding-left:22px;font-size:13.5px;line-height:1.55}
ol.sumy li{margin:0 0 4px}
.rl{font:11.5px var(--mono);color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.code{font:12px/1.5 var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:440px;margin:0}
.code table{border-collapse:collapse;width:100%}
.code td.ln{color:var(--faint);text-align:right;padding:0 10px 0 8px;user-select:none;vertical-align:top;width:1%;white-space:nowrap}
.code td.lc{white-space:pre;padding-right:12px}
.code tr.hl td{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.tk-k{color:#c678dd}.tk-c{color:var(--faint);font-style:italic}.tk-n{color:#d19a66}.tk-s{color:#98c379}.tk-d{color:#61afef}
:root[data-theme="light"] .tk-k{color:#7c3aed}:root[data-theme="light"] .tk-n{color:#b45309}:root[data-theme="light"] .tk-s{color:#15803d}:root[data-theme="light"] .tk-d{color:#0a7ea4}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .tk-k{color:#7c3aed}:root:not([data-theme="dark"]) .tk-n{color:#b45309}:root:not([data-theme="dark"]) .tk-s{color:#15803d}:root:not([data-theme="dark"]) .tk-d{color:#0a7ea4}}
.vbox{overflow-wrap:anywhere;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel2);font-size:13px;line-height:1.55}
.vbox p{font-size:13px}
.diag{width:100%;display:block}
.diag .blk rect{fill:var(--panel2);stroke:var(--line)}
.diag .blk:hover rect{stroke:var(--accent)}
.diag text{font-family:var(--mono)}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.crumbs button{font:600 11.5px var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--dim);cursor:pointer}
.crumbs button[aria-pressed="true"]{color:var(--ink);border-color:var(--accent)}
/* rtl */
.mtree{font:12px var(--mono);max-height:34vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px 0;background:var(--panel2)}
.mtree .nd{display:flex;gap:6px;align-items:center;padding:2px 8px;cursor:pointer;white-space:nowrap}
.mtree .nd:hover{background:var(--hover)} .mtree .nd.on{background:var(--hover);box-shadow:inset 3px 0 0 var(--accent)}
.mtree .nd .tw2{width:12px;color:var(--faint);flex:none;text-align:center}
.mtree .nd small{color:var(--faint);margin-left:auto;padding-left:8px}
.mtree .nd .mm{color:var(--dim)}
.dendro{width:100%;display:block}

/* layout viewer (Layout tab: layout.js) */
.geo{position:relative;background:var(--canvas);flex:1 1 auto;min-height:0;min-width:0;overflow:hidden;outline:none}
.geo .lv-canvas{position:absolute;inset:0}
.geo .lv-busy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font:13px/1.6 var(--sans);color:var(--dim);flex-direction:column;gap:12px}
.lv-dim{color:var(--faint)}
.lv-spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:lvspin 1s linear infinite}
@keyframes lvspin{to{transform:rotate(360deg)}}
.lv-top{position:absolute;left:8px;top:8px;right:8px;display:flex;gap:6px;align-items:flex-start;z-index:4;flex-wrap:wrap;pointer-events:none}
.lv-top>*{pointer-events:auto}
.lv-search{position:relative;flex:0 1 300px;min-width:150px}
.lv-search input{width:100%;background:var(--tipbg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:12px var(--mono)}
.lv-res{position:absolute;left:0;right:0;top:34px;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:320px;overflow:auto;box-shadow:0 10px 30px #0006}
.lv-res button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rowline);padding:5px 8px;font:11.5px var(--mono);color:var(--ink);cursor:pointer;overflow-wrap:anywhere}
.lv-res button:hover{background:var(--hover)}
.lv-res small{color:var(--faint)}
.lv-tag{display:inline-block;font:700 9.5px var(--mono);text-transform:uppercase;color:var(--accent);border:1px solid currentColor;border-radius:4px;padding:0 3px;margin-right:4px}
.lv-info{position:absolute;left:8px;bottom:34px;z-index:3;font:10.5px var(--mono);color:var(--dim);background:var(--tipbg);border:1px solid var(--line);border-radius:6px;padding:2px 7px;max-width:calc(100% - 210px)}
.lv-coord{position:absolute;right:196px;bottom:8px;z-index:3;font:10.5px var(--mono);color:var(--dim);background:var(--tipbg);border:1px solid var(--line);border-radius:6px;padding:2px 7px;min-height:1em}
.lv-coord:empty{display:none}
.lv-scale{position:absolute;left:8px;bottom:8px;z-index:3;font:10.5px var(--mono);color:var(--dim);background:var(--tipbg);border:1px solid var(--line);border-radius:6px;padding:2px 7px;display:flex;align-items:center;gap:6px}
.lv-scale i{display:inline-block;height:6px;border:1.5px solid var(--ink);border-top:0}
.lv-mini{position:absolute;right:8px;bottom:8px;z-index:3;width:180px;height:120px;border:1px solid var(--line);border-radius:8px;background:var(--canvas);cursor:crosshair;touch-action:none}
.lv-tip{position:absolute;z-index:6;pointer-events:none;background:var(--tipbg);border:1px solid var(--line);border-radius:9px;padding:7px 9px;font:12px var(--sans);max-width:380px;box-shadow:0 10px 30px #0006;color:var(--ink)}
.lv-tip .n{font:700 12px var(--mono);word-break:break-all}
.lv-tip .m{color:var(--dim);font:11.5px var(--mono);margin-top:2px;word-break:break-all;line-height:1.45}
.lv-pre{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.lv-pre .btn{padding:4px 8px;font-size:11.5px}
.lv-layers{display:flex;flex-direction:column;gap:1px;font:12px var(--mono)}
.lv-row{display:grid;grid-template-columns:minmax(0,1fr) 22px 84px 40px;align-items:center;gap:6px;padding:2px 4px;border-radius:5px}
.lv-row:hover{background:var(--hover)}
.lv-row.off .lv-ln{opacity:.4}
.lv-vis{display:flex;align-items:center;gap:6px;cursor:pointer;min-width:0}
.lv-vis input{margin:0}
.lv-ln{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv-row small{color:var(--faint);font-size:10px;text-align:center}
.lv-row input[type=range]{width:84px;accent-color:var(--accent)}
.lv-solo{font:600 10px var(--mono);background:none;border:1px solid var(--line);border-radius:5px;color:var(--dim);cursor:pointer;padding:1px 4px}
.lv-solo:hover{color:var(--ink);border-color:var(--faint)}
.lv-sw{width:16px;height:12px;border:1.5px solid var(--c);border-radius:2px;flex:none;display:inline-block;background:color-mix(in srgb,var(--c) 30%,transparent)}
.lv-sw[data-pat="0"]{background:var(--c)}
.lv-sw[data-pat="1"],.lv-sw[data-pat="7"]{background:repeating-linear-gradient(-45deg,var(--c) 0 1.5px,transparent 1.5px 4px)}
.lv-sw[data-pat="2"],.lv-sw[data-pat="8"]{background:repeating-linear-gradient(45deg,var(--c) 0 1.5px,transparent 1.5px 4px)}
.lv-sw[data-pat="3"],.lv-sw[data-pat="9"]{background:repeating-linear-gradient(45deg,var(--c) 0 1px,transparent 1px 4px),repeating-linear-gradient(-45deg,var(--c) 0 1px,transparent 1px 4px)}
.lv-sw[data-pat="5"]{background:repeating-linear-gradient(0deg,var(--c) 0 1.5px,transparent 1.5px 4px)}
.lv-sw[data-pat="6"]{background:repeating-linear-gradient(90deg,var(--c) 0 1.5px,transparent 1.5px 4px)}
.lv-sw[data-pat="4"]{background:radial-gradient(var(--c) 1px,transparent 1.3px) 0 0/4px 4px}
.lv-sw[data-pat="10"]{background:none}
.lv-kinds{margin-top:8px;font-size:12px}
.lv-kinds summary{cursor:pointer;color:var(--dim)}
.lv-kgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;margin-top:6px}
.lv-chk{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink);cursor:pointer}
.lv-ovt{margin-bottom:8px;color:var(--dim)}
.lv-list{display:flex;flex-direction:column;gap:3px}
.lv-f{display:block;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font:12px var(--sans);color:var(--ink);cursor:pointer;overflow-wrap:anywhere}
.lv-f:hover,.lv-f.on{border-color:var(--hot)}
.lv-f small{float:right;color:var(--faint);font:10.5px var(--mono);margin-left:6px}
.lv-sev{font:700 10px var(--mono);border:1px solid currentColor;border-radius:4px;padding:0 4px}
.lv-fd{margin-top:8px;border:1px solid var(--hot);border-radius:8px;padding:8px 10px;background:color-mix(in srgb,var(--hot) 6%,var(--panel))}
.lv-fd h4{margin:0 0 6px;font:700 12.5px var(--sans)}
.lv-fd p{font-size:12px;color:var(--ink);overflow-wrap:anywhere}
.lv-ramp{height:10px;border-radius:3px;margin:4px 0 2px}
.lv-solid .lv-top,.lv-solid .lv-info,.lv-solid .lv-mini,.lv-solid .lv-scale,.lv-solid .lv-coord{display:none!important}
.lv-net{margin-top:10px;padding:7px 9px;border:1px solid var(--accent);border-radius:8px;font:12px var(--mono);overflow-wrap:anywhere}
@media (max-width: 980px){
  .lv-mini{width:120px;height:80px}
  .lv-coord{display:none}
  .lv-info{bottom:34px;max-width:calc(100% - 140px)}
}

/* app shell: slim top bar + three independently scrolling columns (navigation | canvas | details), as the Chip Explorer */
:root{--lw:288px;--rw:420px}
body.tab-rtl{--rw:min(760px,48vw)}
body.tab-facts,body.tab-how{--rw:480px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn.ico{display:inline-flex;align-items:center;justify-content:center;width:32px;height:30px;padding:0;flex:none}
.btn.ico svg{width:16px;height:16px}
.btn.ico.xs{width:24px;height:24px;font-size:16px;line-height:1;border-color:transparent;background:none;color:var(--dim)}
.btn.ico[aria-expanded="false"]{color:var(--dim)}
.btn.ico[aria-expanded="true"]{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.top .crumbs-top{flex:0 1 auto;min-width:0;flex-wrap:nowrap;overflow:hidden;white-space:nowrap}
.top .crumbs-top a,.top .crumbs-top span{flex:none}
.top .crumbs-top .eh-cur{flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;overflow-wrap:normal}
/* help tooltip that replaces the always-visible tab description */
.help{position:relative;flex:none;display:inline-flex}
.hbtn{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--dim);font:700 12px var(--sans);cursor:help;padding:0;line-height:1}
.hbtn:hover,.hbtn:focus-visible,.help.open .hbtn{color:var(--accent);border-color:var(--accent);outline:none}
.pop{display:none;position:absolute;top:calc(100% + 8px);right:-8px;width:min(360px,calc(100vw - 32px));background:var(--tipbg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:12.5px/1.5 var(--sans);color:var(--ink);box-shadow:0 14px 40px #0007;z-index:50;text-align:left}
.help:hover .pop,.hbtn:focus-visible + .pop,.help.open .pop{display:block}
.pop .tabna{display:block;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.pop .tabna[hidden]{display:none!important}
.app{flex:1 1 auto;min-height:0;overflow:hidden;display:grid;grid-template-columns:var(--lw) minmax(0,1fr) var(--rw);position:relative;transition:grid-template-columns .18s ease}
body.nol .app{grid-template-columns:0 minmax(0,1fr) var(--rw)}
body.nor .app{grid-template-columns:var(--lw) minmax(0,1fr) 0}
body.nol.nor .app{grid-template-columns:0 minmax(0,1fr) 0}
.col{min-width:0;min-height:0;overflow:auto;overscroll-behavior:contain;background:var(--panel);scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#lcol{border-right:1px solid var(--line)}
#rcol{border-left:1px solid var(--line)}
body.nol #lcol,body.nor #rcol{visibility:hidden;border:0}
.colhd{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px 6px 14px;font:700 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);background:var(--panel);border-bottom:1px solid var(--line)}
.colhd .btn{display:none}
.center{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--canvas)}
.center .shellview{position:absolute;inset:0;overflow:auto;background:var(--bg);max-width:none;padding:8px 24px 40px}
.center .shellview > *{max-width:1100px}
#rcol .summary{padding:8px 14px;background:none}
#rcol .summary p{font-size:12.5px;color:var(--dim);flex:1 1 auto}
#rcol .pills{padding:8px 14px}
#rcol .pills:empty{display:none}
/* element jump search + chip hierarchy in the navigation column */
.esearch{padding:10px 12px}
.es{position:relative}
.es input{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:12.5px var(--sans)}
.es input:focus{outline:none;border-color:var(--accent)}
.esres{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel2);border:1px solid var(--line);border-radius:9px;max-height:50vh;overflow:auto;z-index:20;box-shadow:0 14px 40px #0008}
.esres a{display:block;padding:6px 9px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--rowline)}
.esres a:hover,.esres a.on{background:var(--hover)}
.esres a b{display:block;font:600 12px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.esres a span{display:block;font-size:11.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.esres p{margin:0;padding:8px 9px;font-size:12px;color:var(--dim)}
.ehier{display:flex;flex-direction:column;margin-top:8px;font:12px var(--sans)}
.ehier a,.ehier span{display:block;padding:3px 6px;border-radius:5px;color:var(--dim);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ehier a:hover{background:var(--hover);color:var(--ink)}
.ehier .cur{color:var(--ink);font:600 12px var(--mono);box-shadow:inset 2px 0 0 var(--accent);background:var(--hover)}
.ehier [data-d="1"]{padding-left:16px} .ehier [data-d="2"]{padding-left:26px} .ehier [data-d="3"]{padding-left:36px}
.ehier [data-d]::before{content:"\2514\00a0";color:var(--faint)}
.ehier [data-d="0"]::before{content:none}
#nav:empty{display:none}
#ehdesc .eh-about{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
#ehdesc .eh-about.full{display:block;cursor:auto}
/* phone / narrow: the side columns become drawers over the canvas */
@media (max-width: 900px){
  .app,body.nol .app,body.nor .app,body.nol.nor .app{grid-template-columns:minmax(0,1fr)}
  .col{position:absolute;top:0;bottom:0;z-index:40;width:min(86vw,380px);visibility:hidden;transform:translateX(-102%);transition:transform .2s ease,visibility 0s .2s;box-shadow:0 0 40px #0009}
  #lcol{left:0}
  #rcol{right:0;transform:translateX(102%);width:min(92vw,460px)}
  body.dl #lcol,body.dr #rcol{visibility:visible;transform:none;transition:transform .2s ease}
  .center{grid-column:1}
  .colhd .btn{display:inline-flex}
  .scrim{position:absolute;inset:0;z-index:35;background:#0008}
  .top{gap:4px 6px;padding:6px 8px;flex-wrap:wrap}
  .top .crumbs-top{order:1;flex:1 1 0;font-size:12px}
  .top .crumbs-top > a,.top .crumbs-top > span[aria-hidden]{display:none}
  #rbtn{order:2} #theme{order:3}
  #lbtn{order:0}
  .tabbar{order:4;flex:1 1 100%;justify-content:flex-start}
  .tabs button{padding:5px 9px;font-size:12.5px}
  .center .shellview{padding:4px 16px 32px}
}
@media (prefers-reduced-motion: reduce){ .app,.col{transition:none!important} }
</style>
