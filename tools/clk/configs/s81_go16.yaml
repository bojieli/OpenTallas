# ot-clk config DRAFT for DIE-S81-18 go16 (opt-in; the die owner sets the plan event + taps): go15 recipe with the P1
# fail-closed stage model = registry entry inv2_ndr_s81_go15 (DIE-S81-17 fit, 16604 routed legs) and early ratio 1.0/1.0
# (DIE-S81-17 ASK default). Plan below is still plan_s11 until DIE-S81-18 writes its go16 event; no reference run yet.
schema: ot_clk_config/1
die: s81
event:
  name: go16-draft
  host: intel2
  source: DIE-S81-17 ASK default 2026-10-28 21:31 (go16 = plan_s11 + taps + S81 stage cal + early 1.0/1.0)
  reference_clock_dir:
inputs:
  plan: /srv/opentallas-scratch2/claude/die-s81-16/plan/plan_s11.json
  region_map: /srv/opentallas-scratch2/claude/die-s81-14/go14/map398.json
  feed: /srv/opentallas-scratch2/claude/die-s81-14/go14/feed_sb6.json
stack:
  cell: inv2
  clock_rc: ndr
top:
  form: link_htree
  leaf_um: 200
  rep_um: 250
  site_legal: true
  site_slide: true
  opts:
    dme_feed_centroid: 1
region:
  form: dme
  dme_mode: delay
  only:
    all_from_map: true
  early:
    tt: 1.0
    ff: 1.0
    mode: merge
stage_model:
  entry: inv2_ndr_s81_go15
  corners: [TT]
  edge: rise
residual:
  snake: all
  cell_paths: true
