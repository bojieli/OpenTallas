# ot-clk config: QC die clock of record for the next QC clock trial (P2, CLK-TOOL-3), = DIE-QC-25 trial25
# (intel2 die-qc25-1028/kit25.sh t25): DIE-QC-21 trial14 stock tree on plan event ev_qc25 + inv2 stage model refit on
# trial24 routed legs (registry inv2_ndr_qc_trial24) + --rep-on-leg + --rep-off-leg-max 50 (DIE-QC-24 opt-in flags,
# die_trial at claude/die-qc25-1028 until ROOT-MERGE lands them on main).  Inputs are fleet scratch paths (host intel2).
schema: ot_clk_config/1
die: qc
event:
  name: trial25
  host: intel2
  source: die-qc25-1028/kit25.sh t25 (die_trial at claude/die-qc25-1028@2e6c50dc60)
  reference_clock_dir: /srv/opentallas-scratch2/claude/die-qc25-1028/trial25/clock
inputs:
  plan: /srv/opentallas-scratch2/claude/die-qc25-1028/plan/ev_qc25.json
  region_map: /srv/opentallas-scratch2/claude/codex-die-qc-0359-1028/build_inputs/part_region.json
  feed: /srv/opentallas-scratch2/claude/die-qc11-1028/plan/feed_rt2.json
stack:
  cell: inv2
  clock_rc: ndr
top:
  form: link_htree
  leaf_um: 200
  rep_um: 250
  site_legal: true
  site_slide: true
  rep_on_leg: true
  rep_off_leg_max: 50
  opts:
    dme_feed_centroid: 1
    region_stub: 1
region:
  form: dme
  dme_mode: delay
  only:
    - "c_{E,W}{0..5}_{bf,bn,tf,tn}_{00,01,10,11}"
    - "sl_{E,W}{0..5}_su_c"
  early:
    tt: 1.0
    ff: 0.87
    merge_only:
      - "c_{E,W}{0..5}_{bf,bn,tf,tn}_{00,01,10,11}"
  workers: 24
stage_model:
  entry: inv2_ndr_qc_trial24
  corners: [TT, FF]
  edge: rise
residual:
  snake:
    - "sl_{E,W}{0..5}_su_c"
    - "c_{E,W}{0..5}_{bf,bn,tf,tn}_{00,01,10,11}"
