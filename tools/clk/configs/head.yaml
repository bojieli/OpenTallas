# ot-clk config: HEAD die spine as built by DIE-HEAD-11 (inv2 rep 200 = inv2r200; LAND-HEAD 09:25: "same kit/plan/flags
# as sfb250 (fb1_lat.json, spine_fishbone, leaf 600, tree-site-slide)").  Geometric spine_fishbone, no stage model.
schema: ot_clk_config/1
die: head
event:
  name: inv2r200
  host: intel2
  source: LAND-HEAD 2026-10-28 09:25 DIE-HEAD-11 (die_trial at DIE-QC-11 1465eff51c); argv not scripted, from the lane line
  reference_clock_dir: /srv/opentallas-scratch2/claude/die-head-11/inv/inv2r200/clock
inputs:
  # The event plan is fb1_lat.json (die-head-3/cmp).  Its hard-core pins_file paths point into the deleted worktree
  # wt/die-head-3-bind; pins_rebase replays it on the pin tables committed in this repo
  # (physical/die_plan/s81_head/cores/elem{A,B}_pins.json, CLK-TOOL-2).  CLK-TOOL-1 replayed the DIE-HEAD-11 copy
  # g5_r200/plan_rs_fb1.json instead (pins via wt/die-head-1, same tree).
  plan: /srv/opentallas-scratch2/claude/die-head-3/cmp/fb1_lat.json
  pins_rebase:
    from: ../../wt/die-head-3-bind/
    to_repo: ""
stack:
  cell: inv2
  clock_rc: ndr
top:
  form: spine_fishbone
  leaf_um: 600
  rep_um: 200
  site_slide: true
region:
  form: none
