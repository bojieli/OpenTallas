# ot-clk config: QC die clock as built by DIE-QC-21 trial14 (results/die_qc21_1028/kit21.sh, case t13) on main die_trial.
# Current QC release form per DIE-QC-23/24: stock trial14 tree form (trial15/16 added the unmerged --region-dme-snake-cap,
# rejected).  Inputs are fleet scratch paths of that event (host intel2).
schema: ot_clk_config/1
die: qc
event:
  name: trial14
  host: intel2
  source: results/die_qc21_1028/kit21.sh t13 (die_trial at claude/die-qc21-1028)
  reference_clock_dir: /srv/opentallas-scratch2/claude/die-qc21-1028/trial14/clock
inputs:
  plan: /srv/opentallas-scratch2/claude/die-qc20-1028/plan/ev_a0meas.json
  region_map: /srv/opentallas-scratch2/claude/codex-die-qc-0359-1028/build_inputs/part_region.json
  feed: /srv/opentallas-scratch2/claude/die-qc11-1028/plan/feed_rt2.json
stack:
  cell: inv2
  clock_rc: ndr
top:
  form: link_htree
  leaf_um: 200
  rep_um: 250
  site_legal: true
  site_slide: true
  opts:
    dme_feed_centroid: 1
    region_stub: 1
region:
  form: dme
  dme_mode: delay
  only:
    - "c_{E,W}{0..5}_{bf,bn,tf,tn}_{00,01,10,11}"
    - "sl_{E,W}{0..5}_su_c"
  early:
    tt: 1.0
    ff: 0.87
    merge_only:
      - "c_{E,W}{0..5}_{bf,bn,tf,tn}_{00,01,10,11}"
  workers: 24
stage_model:
  entry: inv2_ndr_qc_trial13b
  corners: [TT]
  edge: rise
residual:
  snake:
    - "sl_{E,W}{0..5}_su_c"
    - "c_{E,W}{0..5}_{bf,bn,tf,tn}_{00,01,10,11}"
