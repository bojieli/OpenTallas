# ot-clk config: HBM hub REGION MESH, grid topology (HBM-HUBMESH-1, OWNER 12.26 parallel form to the sb63 regional tree).
# Variant A: 16 M9 x 16 M8 4W straps over the whole hub partition, 16 BUFx24 drivers per vertical strap (256), zero-skew
# merge pre-mesh tree from the plan clock entry, repeaters <= 360 um, cells slid off hard cores.  Estimate:
# results/die_hbm_1031/hubmesh1/ESTIMATE.md.  Plan d44f (DIE-HBM-45 plan dir), tap map = DIE-HBM-45 B kit tree.json
# (the hub taps C1/C2/C3 use).  Electrical values = qc_mesh_p2 (same ASAP7 stack, strap keep-out form).
schema: ot_clk_config/1
die: hbm
event:
  name: hubmesh_a
  host: epyc2
  source: HBM-HUBMESH-1 claude/hbm-hubmesh-1-1031
inputs:
  plan: /srv/opentallas-scratch2/claude/hbm-hubmesh-1/in/die_plan_d44f.json
  tree: /srv/opentallas-scratch2/claude/hbm-hubmesh-1/in/tree_B_d44f.json
stack:
  cell: buf
  clock_rc: ndr
region:
  form: mesh
  parts:
    - NW_hub
    - NE_hub
  mesh:
    topology: grid
    grid:
      v_straps: 16
      h_straps: 16
      drivers_per_col: 16
      rep_max_um: 360.0
      legal_step_um: 2.0
      legal_max_um: 400.0
      root: plan_entry
      early: none
      core_tap_prefix: clk_c
      core_load_ff: 2.94
    adjust: 0.4
    driver_master: BUFx24_ASAP7_75t_R
    load_master: BUFx4f_ASAP7_75t_R
    cell_w: {BUFx24_ASAP7_75t_R: 1.62, BUFx4f_ASAP7_75t_R: 0.432}
    site_name: asap7sc7p5t
    site_w: 0.054
    row_h: 0.27
    dbu: 1000
    pg_pitch: 4.32
    pg_w: {M8: 0.48, M9: 0.672}
    strap_w: 0.16
    strap_layers: {h: M8, v: M9, via: VIA89}
    strap_keepout_um: 0.32
    core_layers: [M1, M2, M3, M4, M5, M6, M7]
    window_layers: [M2, M3, M4, M5, M6, M7]
    window: [-3, -3, 4.7, 3.3]
    core_keepout: 0.5
    ndr:
      name: CK2W2S
      layers: [M8, M9]
      width: 0.08
      spacing: 0.32
    period_ps: 833.0
    edges: rise
    routing:
      signal: M2-M9
      clock: M8-M9
      adjust_layers: [M8, M9]
      blocked_layers: [M2, M3, M4, M5, M6, M7]
      blocked_adjust: 0.99
      grt_iterations: 50
    run:
      name_prefix: hbmhm
      memory: 48g
      cpus: 16
      threads: 16
      image: openroad/orfs:asap7lock
      libdir: /OpenROAD-flow-scripts/flow/platforms/asap7/lib/NLDM
    rec:
      driver_pin_dy: 0.135
      ndr: 4w
      rc: r6
      tap_load_ff: 2.3
