[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opentallas"
version = "0.1.0"
description = "Evidence-driven simulator for model-specific ROM inference silicon"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
compiler = ["tokenizers==0.22.2"]
qwen3 = [
  "jinja2>=3.1",
  "jsonschema>=4.18",
  "safetensors>=0.4.3",
  "tokenizers==0.22.2",
  "torch>=2.6",
]
qwen3-reference = [
  "safetensors>=0.4.3",
  "tokenizers==0.21.4",
  "torch>=2.6",
  "transformers==4.51.0",
]
plot = ["matplotlib>=3.6"]
test = ["jsonschema>=4.18", "pytest>=7", "referencing>=0.30"]

[project.scripts]
opentallas = "opentallas.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
